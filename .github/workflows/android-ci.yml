name: Android CI + Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper missing, generating..."
            gradle wrapper --gradle-version 9.3.1
          fi

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Generate google-services.json (stub)
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "fastrecorder-placeholder",
              "storage_bucket": "fastrecorder-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.dika.fastrecorder"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyPlaceholderKeyForCI123456789"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew testDebugUnitTest --tests "com.dikacode.security.*" || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastRecorder-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastRecorder-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk

      - name: Deploy APK to release branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch release branch if exists
          git fetch origin release 2>/dev/null || true

          # Create/update release branch orphan-style with only apks + README
          git checkout -B release

          # Ensure apks directory
          mkdir -p apks

          # Copy built APKs (force)
          cp app/build/outputs/apk/debug/*.apk apks/ 2>/dev/null || echo "No debug APK"
          cp app/build/outputs/apk/release/*.apk apks/ 2>/dev/null || echo "No release APK"

          # Generate simple index README
          cat > apks/README.md << EOF2
          # FastRecorder APKs — auto-built from main

          Last commit: ${{ github.sha }}
          Built: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Workflow: ${{ github.run_id }}

          ## Download
          - Debug: check apks/*debug*.apk
          - Release: check apks/*release*.apk

          > This branch is auto-updated on every push to main. Do not edit manually.
          EOF2

          # .gitignore ignores *.apk, so force add
          git add -f apks/*.apk apks/README.md

          # Only commit if changed
          if git diff --cached --quiet; then
            echo "No APK changes to commit"
          else
            git commit -m "chore(release): update APKs from ${{ github.sha }} [skip ci]"
            git push -f origin release
            echo "Pushed to release branch"
          fi

          # Return to main for post steps
          git checkout main || git checkout -
      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## FastRecorder ${{ github.ref_name }}
            
            ### What's Changed
            - Security system with defense-in-depth architecture
            - Neobrutalism UI with dark mode
            - Internal audio capture support
            - Catbox cloud upload
            
            ### Installation
            1. Download the APK below
            2. Enable "Install from unknown sources"
            3. Install and enjoy!
            
            ### Security
            This build includes cryptographic integrity verification.
            Check security status in Settings → Security & Integrity.
            
            ---
            Developed by [@dikaacode](https://t.me/dikaacode)
