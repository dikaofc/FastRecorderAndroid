name: Android CI + Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper missing, generating..."
            gradle wrapper --gradle-version 9.3.1
          fi

      - name: Generate debug keystore
        run: |
          if [ -f "debug.keystore" ]; then
            echo "debug.keystore exists, reusing stable key"
          else
            echo "Generating stable debug.keystore (first time, will be committed)"
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]" 2>/dev/null || true
            git config user.email "github-actions[bot]@users.noreply.github.com" 2>/dev/null || true
            git add -f debug.keystore || true
            git diff --cached --quiet || git commit -m "chore: add stable debug keystore for consistent signing [skip ci]" || true
            git push origin main 2>/dev/null || echo "push keystore skipped (no permission or already exists)"
          fi
          # Ensure app/ also has it for fallback path
          cp debug.keystore app/debug.keystore 2>/dev/null || true

      - name: Generate google-services.json (stub)
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "fastrecorder-placeholder",
              "storage_bucket": "fastrecorder-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.dika.fastrecorder"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyPlaceholderKeyForCI123456789"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew testDebugUnitTest --tests "com.dikacode.security.*" || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastRecorder-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastRecorder-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk

      - name: Deploy APK to release branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch release branch if exists
          git fetch origin release 2>/dev/null || true

          # Create/update release branch — 2 APKs langsung di root release (bukan di folder)
          git checkout -B release

          # Restore workflow file to avoid 'workflows' permission error on push
          git checkout origin/main -- .github/workflows/android-ci.yml 2>/dev/null || git checkout HEAD -- .github/workflows/android-ci.yml 2>/dev/null || true
          # Also ensure we don't have modified gradle wrapper files dirty
          git checkout HEAD -- gradle/wrapper/gradle-wrapper.properties gradlew 2>/dev/null || true

          # Copy built APKs langsung ke root release branch
          cp app/build/outputs/apk/debug/*.apk ./ 2>/dev/null || echo "No debug APK"
          cp app/build/outputs/apk/release/*.apk ./ 2>/dev/null || echo "No release APK"
          # Bersihin folder apks lama biar gak dobel
          git rm -rf apks 2>/dev/null || rm -rf apks 2>/dev/null || true

          # Generate simple index README di root
          cat > README.md << EOF2
          # FastRecorder APKs — auto-built from main

          Last commit: ${{ github.sha }}
          Built: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Workflow: ${{ github.run_id }}

          ## Download — 2 APK langsung di release branch
          - \`app-debug.apk\` — debug build
          - \`app-release.apk\` — release build (R8 optimized)

          > This branch is auto-updated on every push to main. Do not edit manually.
          EOF2

          # .gitignore ignores *.apk, so force add 2 APKs di root
          git add -f *.apk README.md
          # also remove apks/ from index if it existed
          git rm -r --cached apks 2>/dev/null || true

          # Only commit if changed
          if git diff --cached --quiet; then
            echo "No APK changes to commit"
          else
            git commit -m "chore(release): update APKs from ${{ github.sha }} [skip ci]"
            git push -f origin release
            echo "Pushed to release branch"
          fi

          # Return to main for post steps
          git checkout main || git checkout -
      - name: Create GitHub Release (auto on main + tag)
        if: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('FastRecorder {0}', github.ref_name) || format('FastRecorder v1.0.{0}', github.run_number) }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## FastRecorder ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}

            Auto-built from `${{ github.sha }}` — run `${{ github.run_id }}` — `v1.0.${{ github.run_number }}`

            ### What's Changed
            - Security system with defense-in-depth architecture
            - Neobrutalism UI with dark mode
            - Internal audio capture support
            - Catbox cloud upload
            
            ### Installation
            1. Download the APK below
            2. Enable "Install from unknown sources"
            3. Install and enjoy!
            
            ### Security
            This build includes cryptographic integrity verification.
            Check security status in Settings → Security & Integrity.
            
            ---
            Developed by [@dikaacode](https://t.me/dikaacode)
